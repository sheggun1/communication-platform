<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Communication Platform</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="login-page"><main class="login-card"><div class="brand-mark">CP</div><h1>Communication Platform</h1><p>Sign in to manage your campaigns.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label>Admin password</label><input type="password" name="password" required autocomplete="current-password"><button class="primary full">Sign in</button></form><small>Ask the platform administrator for access.</small></main></body></html>
